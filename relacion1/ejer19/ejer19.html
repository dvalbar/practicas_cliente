<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="./../js/ejer19.js" defer></script>
    <title>Ejercicio 19</title>
</head>

<body>
    <div id="documento">
        <h1>Ejercicio 19</h1>
        <p>19. Desarrolla una aplicación que permita calcular los salarios brutos y netos mensuales de los
            trabajadores de una empresa a partir de los siguientes datos:</p>
        <input id="nombre" type="text" placeholder="Nombre:">
        <input id="apellidos" type="text" placeholder="Apellidos:">
        <input id="horas" type="number" placeholder="Horas trabajadas:"><br><br>

        <input type="radio" id="maniana" name="turno" value="maniana">
        <label for="maniana">Mañanas</label><br>
        <input type="radio" id="tarde" name="turno" value="tarde">
        <label for="tarde">Tardes</label><br>
        <input type="radio" id="noche" name="turno" value="noche">
        <label for="noche">Noches</label><br><br>

        <button id="empleado">Añadir empleado</button>
        <button id="final">Importe total</button>

        <p id="miP"></p>
    </div>
</body>

</html>
